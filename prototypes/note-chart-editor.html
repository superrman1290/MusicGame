<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=1200">
<title>Note Chart 编辑器 · 节拍柱阵管理面板</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d0d14;color:#ccc;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;user-select:none}
  #toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#151520;border:1px solid #2a2a40;border-radius:10px;padding:10px 18px;margin-bottom:8px;width:1100px}
  #toolbar label{font-size:12px;color:#888}
  #toolbar input[type=text],#toolbar input[type=number]{background:#1a1a2e;border:1px solid #333;color:#ddd;border-radius:6px;padding:5px 8px;font-size:13px;width:100px}
  #toolbar button{background:#2a2a40;border:1px solid #444;color:#ccc;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;transition:background 0.15s}
  #toolbar button:hover{background:#3a3a50}
  #toolbar button.active{background:#4fc3f7;color:#0a0a14;border-color:#4fc3f7}
  #toolbar button.primary{background:#2a5a3a;border-color:#3a8a4a}
  #toolbar button.primary:hover{background:#3a6a4a}
  #toolbar button.danger{background:#5a2020;border-color:#883333}
  #toolbar button.danger:hover{background:#6a3030}
  #toolbar .sep{width:1px;height:22px;background:#333;margin:0 4px}
  #toolbar input[type=checkbox]{accent-color:#4fc3f7}
  select{background:#1a1a2e;border:1px solid #333;color:#ddd;border-radius:6px;padding:5px 8px;font-size:12px}
  #hint-bar{display:flex;gap:24px;align-items:center;background:#151520;border:1px solid #2a2a40;border-radius:8px;padding:8px 18px;margin-bottom:8px;width:1100px;font-size:12px;color:#888}
  #hint-bar .hint{display:flex;align-items:center;gap:6px}
  #hint-bar .hint-icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:4px;background:#1a1a2e;border:1px solid #333;font-size:13px}
  #hint-bar .key-hint{background:#1a1a2e;border:1px solid #4fc3f7;color:#4fc3f7;border-radius:4px;padding:2px 6px;font-size:11px;margin:0 2px}
  canvas{border:1px solid #2a2a40;border-radius:8px;cursor:crosshair}
  #status{display:flex;gap:20px;margin-top:6px;font-size:12px;color:#666;width:1100px}
  #status span strong{color:#aaa}
  #toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a5a2a;border:1px solid #3a8a4a;color:#cfc;padding:10px 24px;border-radius:8px;font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.3s}
  #toast.show{opacity:1}
  #toast.warn{background:#5a3a1a;border-color:#8a6a3a;color:#fca}
  #toast.err{background:#5a2020;border-color:#883333;color:#faa}
</style>
</head>
<body>

<div id="toast"></div>

<div id="toolbar">
  <label>曲名</label>
  <input type="text" id="songTitle" value="Demo Song" style="width:140px">
  <label>BPM</label>
  <input type="number" id="bpm" value="140" min="40" max="300" style="width:64px">
  <div class="sep"></div>
  <button id="btnLoadAudio">加载音频</button>
  <input type="file" id="audioFile" accept="audio/*" style="display:none">
  <button id="btnPlay">▶ 播放</button>
  <button id="btnStop">⏹ 停止</button>
  <div class="sep"></div>
  <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:#888">密度
    <select id="densitySelect">
      <option value="0.3">稀疏</option>
      <option value="0.7" selected>中等</option>
      <option value="1.0">密集</option>
    </select>
  </label>
  <button id="btnAutoGen" class="primary">📊 从波形生成</button>
  <div class="sep"></div>
  <button id="btnZoomOut">−</button>
  <span id="zoomLabel" style="font-size:12px;color:#888;min-width:48px;text-align:center">80%</span>
  <button id="btnZoomIn">+</button>
  <div class="sep"></div>
  <label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="snapToggle" checked>吸附</label>
  <select id="snapSelect"><option value="1">1拍</option><option value="2">1/2拍</option><option value="4" selected>1/4拍</option><option value="8">1/8拍</option></select>
  <div class="sep"></div>
  <button id="btnExport" class="primary">导出 JSON</button>
  <button id="btnImport">导入 JSON</button>
  <input type="file" id="jsonFile" accept=".json" style="display:none">
  <button id="btnClear" class="danger">清空</button>
</div>

<div id="hint-bar">
  <div class="hint"><span class="hint-icon">🖱</span> 左键点击通道 = 放置音符</div>
  <div class="hint"><span class="hint-icon">🗑</span> <span class="key-hint">Shift</span>+点击 = 删除</div>
  <div class="hint"><span class="hint-icon">↔</span> 拖动空白区 = 滚动时间轴</div>
  <div class="hint"><span class="hint-icon">⌨</span> <span class="key-hint">空格</span> = 播放/暂停</div>
  <div class="hint"><span class="hint-icon">🖱</span> <span class="key-hint">滚轮</span> = 横向滚动</div>
</div>

<canvas id="editor" width="1100" height="420"></canvas>

<div id="status">
  <span id="noteCount">音符: 0</span>
  <span id="durationDisplay">时长: 0:00</span>
  <span id="hoverInfo" style="color:#888">将鼠标移到通道上开始编辑</span>
</div>

<script>
const canvas = document.getElementById('editor');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const LX = 0, LW = 55, SX = 60, SAW = W - SX - 5;
const WY = 0, WH = 85, LY0 = WY + WH + 5, LH = 58, LG = 2;
const LY = [LY0, LY0+LH+LG, LY0+(LH+LG)*2, LY0+(LH+LG)*3];
const LC = ['#4fc3f7','#81c784','#ffb74d','#e57373'];
const LL = ['D','F','J','K'];
const BRY = LY[3] + LH + 4, TLY = BRY + 20;
const NW = 22, NH = 30;

let notes=[], bpm=140, zoom=0.08, scrollTime=0;
let isDragging=false, dragStartX=0, dragStartScroll=0;
let audioBuffer=null, audioMeta=null, audioCtx=null, isPlaying=false, playStartAudioTime=0, playStartTime=0, playbackEndTime=0, scheduledOscs=[];
let audioSource=null, playbackToken=0, fallbackStopTimer=null, waveformPeakCache=null;
let hoverLane=-1, hoverTime=0, hoverOnLane=false;

async function sha256Hex(buffer){
  if(!globalThis.crypto?.subtle)return '';
  const digest=await crypto.subtle.digest('SHA-256',buffer);
  return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
}

function timeToX(timeMs){return SX+(timeMs-scrollTime)*zoom}
function xToTime(x){return scrollTime+(x-SX)/zoom}
function pxToMs(px){return px/zoom}
function fmt(ms,p){const s=ms/1000,m=Math.floor(s/60),sec=s-m*60;if(p==='ms')return `${m}:${sec.toFixed(2).padStart(5,'0')}`;if(p==='d1')return `${m}:${sec.toFixed(1).padStart(4,'0')}`;return `${m}:${String(Math.floor(sec)).padStart(2,'0')}`}
function snapInt(){const bm=60000/bpm;return bm/parseInt(document.getElementById('snapSelect').value)}
function snap(t){if(!document.getElementById('snapToggle').checked)return t;const iv=snapInt();return Math.round(t/iv)*iv}
function dur(){return notes.length?Math.max(...notes.map(n=>n.time_ms)):0}

function addNote(t,lane){const st=snap(Math.max(0,t));if(notes.some(n=>n.lane===lane&&Math.abs(n.time_ms-st)<1))return;notes.push({time_ms:st,lane});notes.sort((a,b)=>a.time_ms-b.time_ms||a.lane-b.lane);updateUI();draw()}
function removeNote(t,lane){const iv=snapInt();notes=notes.filter(n=>!(n.lane===lane&&Math.abs(n.time_ms-t)<iv*0.6));updateUI();draw()}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawWaveform();
  drawLanes();
  drawBeatGrid();
  drawNotes();
  drawHoverGhost();
  drawPlayhead();
  drawRuler();
}

function buildWaveformPeakCache(buffer){
  const data=buffer.getChannelData(0),bucketSize=256,bucketCount=Math.ceil(data.length/bucketSize),peaks=new Float32Array(bucketCount);
  for(let bucket=0;bucket<bucketCount;bucket++){
    const start=bucket*bucketSize,end=Math.min(start+bucketSize,data.length);let peak=0;
    for(let sample=start;sample<end;sample++)peak=Math.max(peak,Math.abs(data[sample]));
    peaks[bucket]=peak;
  }
  return {data,bucketSize,peaks};
}

function samplePeak(startSample,endSample){
  const {data,bucketSize,peaks}=waveformPeakCache;
  const start=Math.max(0,Math.floor(startSample)),end=Math.min(data.length,Math.ceil(endSample));
  if(start>=end)return 0;
  let peak=0,sample=start;
  while(sample<end&&sample%bucketSize!==0){peak=Math.max(peak,Math.abs(data[sample++]));}
  while(sample+bucketSize<=end){peak=Math.max(peak,peaks[Math.floor(sample/bucketSize)]);sample+=bucketSize;}
  while(sample<end){peak=Math.max(peak,Math.abs(data[sample++]));}
  return peak;
}

function drawWaveform(){
  ctx.fillStyle='#111122';ctx.fillRect(SX,WY,SAW,WH);ctx.strokeStyle='#2a2a40';ctx.strokeRect(SX,WY,SAW,WH);
  if(audioBuffer&&waveformPeakCache){
    const samplesPerMs=audioBuffer.sampleRate/1000,msPerPixel=pxToMs(1);
    ctx.fillStyle='#4fc3f7';ctx.globalAlpha=0.5;
    for(let px=0;px<SAW;px++){
      const pixelStartTime=xToTime(SX+px),pixelEndTime=pixelStartTime+msPerPixel;
      if(pixelStartTime>=audioBuffer.duration*1000)break;
      const peak=samplePeak(pixelStartTime*samplesPerMs,pixelEndTime*samplesPerMs),h=peak*WH*0.7;
      ctx.fillRect(SX+px,WY+WH/2-h/2,1,Math.max(1,h));
    }
    ctx.globalAlpha=1;
  }else{
    ctx.fillStyle='#555';ctx.font='13px system-ui';ctx.textAlign='center';
    ctx.fillText('加载音频文件后此处显示波形',SX+SAW/2,WY+WH/2+4);
  }
}

function drawLanes(){
  LL.forEach((l,i)=>{
    ctx.fillStyle='#151520';ctx.fillRect(LX,LY[i],LW,LH);ctx.strokeStyle='#2a2a40';ctx.strokeRect(LX,LY[i],LW,LH);
    ctx.fillStyle=LC[i];ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(l,LX+LW/2,LY[i]+LH/2+5);
    ctx.fillStyle=hoverLane===i&&hoverOnLane?'#18182a':'#0d0d18';
    ctx.fillRect(SX,LY[i],SAW,LH);
    ctx.strokeStyle=hoverLane===i&&hoverOnLane?'rgba(255,255,255,0.12)':'rgba(255,255,255,0.05)';
    ctx.lineWidth=hoverLane===i&&hoverOnLane?1:0.5;ctx.strokeRect(SX,LY[i],SAW,LH);
    ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(SX,LY[i]+LH/2);ctx.lineTo(SX+SAW,LY[i]+LH/2);ctx.stroke();
    // 悬停高亮
    if(hoverLane===i&&hoverOnLane){
      ctx.fillStyle='rgba(255,255,255,0.04)';ctx.fillRect(SX,LY[i],SAW,LH);
    }
  });
}

function drawBeatGrid(){
  const bm=60000/bpm,vs=scrollTime,ve=scrollTime+pxToMs(SAW),fb=Math.floor(vs/bm)*bm;
  for(let t=fb;t<=ve;t+=bm){
    const x=timeToX(t);if(x<SX||x>SX+SAW)continue;
    const isBar=Math.round(t/bm)%4===0;
    ctx.strokeStyle=isBar?'rgba(255,255,255,0.12)':'rgba(255,255,255,0.04)';
    ctx.lineWidth=isBar?1:0.5;ctx.setLineDash(isBar?[]:[3,5]);
    ctx.beginPath();ctx.moveTo(x,LY[0]);ctx.lineTo(x,LY[3]+LH);ctx.stroke();ctx.setLineDash([]);
  }
}

function drawNotes(){
  const vs=scrollTime-50,ve=scrollTime+pxToMs(SAW)+50;
  notes.forEach(n=>{
    if(n.time_ms<vs||n.time_ms>ve)return;
    const x=timeToX(n.time_ms)-NW/2,y=LY[n.lane]+LH/2-NH/2;
    ctx.fillStyle=LC[n.lane];ctx.shadowColor=LC[n.lane];ctx.shadowBlur=6;
    ctx.beginPath();ctx.roundRect(x,y,NW,NH,4);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(x,y,NW,4);
    // 边框
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(x,y,NW,NH,4);ctx.stroke();
    ctx.shadowBlur=0;
  });
}

function drawHoverGhost(){
  if(!hoverOnLane||hoverLane<0)return;
  const st=snap(hoverTime),x=timeToX(st)-NW/2,y=LY[hoverLane]+LH/2-NH/2;
  const exists=notes.some(n=>n.lane===hoverLane&&Math.abs(n.time_ms-st)<1);
  ctx.globalAlpha=exists?0.15:0.4;
  ctx.fillStyle=LC[hoverLane];ctx.strokeStyle=LC[hoverLane];
  ctx.lineWidth=1;ctx.setLineDash([3,2]);
  ctx.beginPath();ctx.roundRect(x,y,NW,NH,4);ctx.fill();ctx.stroke();
  ctx.setLineDash([]);ctx.globalAlpha=1;
}

function currentPlaybackTime(){
  if(!isPlaying||!audioCtx)return playStartTime;
  return Math.min(playbackEndTime,playStartTime+(audioCtx.currentTime-playStartAudioTime)*1000);
}

function drawPlayhead(){
  if(!isPlaying||!audioCtx)return;
  const px=timeToX(currentPlaybackTime());
  if(px<SX||px>SX+SAW)return;
  ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,WY);ctx.lineTo(px,LY[3]+LH);ctx.stroke();
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.moveTo(px,WY);ctx.lineTo(px-6,WY-8);ctx.lineTo(px+6,WY-8);ctx.fill();
}

function drawRuler(){
  ctx.fillStyle='#0d0d14';ctx.fillRect(SX,BRY,SAW,22);ctx.strokeStyle='#2a2a40';ctx.strokeRect(SX,BRY,SAW,22);
  const bm=60000/bpm,vs=scrollTime,ve=scrollTime+pxToMs(SAW);
  // 根据 zoom 选择刻度精度
  let tickMs, tickMinor, labelFmt;
  if(zoom>=0.3){tickMs=bm/2;tickMinor=bm/4;labelFmt='ms'}
  else if(zoom>=0.15){tickMs=bm;tickMinor=bm/2;labelFmt='d1'}
  else if(zoom>=0.08){tickMs=bm*2;tickMinor=bm;labelFmt=''}
  else{tickMs=bm*4;tickMinor=bm*2;labelFmt=''}
  const ft=Math.floor(vs/tickMs)*tickMs;
  ctx.fillStyle='#888';ctx.font='9px system-ui';ctx.textAlign='center';
  for(let t=ft;t<=ve;t+=tickMs){
    const x=timeToX(t);if(x<SX||x>SX+SAW)continue;
    const isMajor=t%(tickMs*2)===0||tickMs>=bm*4;
    ctx.fillStyle=isMajor?'#aaa':'#666';ctx.font=isMajor?'9px system-ui':'8px system-ui';
    ctx.fillText(labelFmt?fmt(t,labelFmt):fmt(t),x,BRY+10);
    ctx.strokeStyle=isMajor?'rgba(255,255,255,0.1)':'rgba(255,255,255,0.04)';
    ctx.beginPath();ctx.moveTo(x,BRY);ctx.lineTo(x,BRY+(isMajor?7:3));ctx.stroke();
  }
}

function updateUI(){
  document.getElementById('noteCount').innerHTML=`<strong>音符:</strong> ${notes.length}`;
  document.getElementById('durationDisplay').innerHTML=`<strong>时长:</strong> ${fmt(dur())}`;
  document.getElementById('zoomLabel').textContent=`${Math.round(zoom*1000)}%`;
}

/* ========== 交互 ========== */
canvas.addEventListener('mousedown',e=>{
  const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(mx<SX)return;
  let lane=-1;for(let i=0;i<4;i++){if(my>=LY[i]&&my<LY[i]+LH){lane=i;break}}
  if(lane>=0){
    if(e.shiftKey)removeNote(xToTime(mx),lane);else addNote(xToTime(mx),lane);
  }else{isDragging=true;dragStartX=e.clientX;dragStartScroll=scrollTime}
  e.preventDefault();
});

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(isDragging){const dx=e.clientX-dragStartX;scrollTime=Math.max(0,dragStartScroll-dx/zoom);draw()}
  hoverOnLane=mx>=SX&&mx<SX+SAW;hoverLane=-1;
  if(hoverOnLane){for(let i=0;i<4;i++){if(my>=LY[i]&&my<LY[i]+LH){hoverLane=i;break}}}
  hoverTime=hoverOnLane?xToTime(mx):0;
  if(hoverOnLane){
    const st=snap(hoverTime);
    document.getElementById('hoverInfo').innerHTML=`<strong>${fmt(st)}</strong> | Lane <strong style="color:${hoverLane>=0?LC[hoverLane]:'#888'}">${hoverLane>=0?LL[hoverLane]:'—'}</strong> | ${hoverLane>=0?'点击放置 / Shift+点击删除':'不在通道上'}`;
  }else{document.getElementById('hoverInfo').textContent='将鼠标移到通道上开始编辑'}
  draw();
});

canvas.addEventListener('mouseup',()=>{isDragging=false});
canvas.addEventListener('mouseleave',()=>{isDragging=false;hoverOnLane=false;hoverLane=-1;draw()});
canvas.addEventListener('wheel',e=>{e.preventDefault();scrollTime=Math.max(0,scrollTime+e.deltaY/zoom);draw()});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

/* ========== 音频 ========== */
document.getElementById('btnLoadAudio').addEventListener('click',()=>document.getElementById('audioFile').click());
document.getElementById('audioFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')await audioCtx.resume();
  const ab=await f.arrayBuffer();
  const sha256=await sha256Hex(ab);
  audioBuffer=await audioCtx.decodeAudioData(ab.slice(0));
  audioMeta={name:f.name,size:f.size,lastModified:f.lastModified,duration_ms:Math.round(audioBuffer.duration*1000),sha256};
  waveformPeakCache=buildWaveformPeakCache(audioBuffer);
  document.getElementById('songTitle').value=f.name.replace(/\.[^.]+$/,'');
  draw();
});

function stopPlayback(token=playbackToken){
  if(token!==playbackToken)return;
  playbackToken++;
  isPlaying=false;
  if(fallbackStopTimer){clearTimeout(fallbackStopTimer);fallbackStopTimer=null;}
  scheduledOscs.forEach(o=>{try{o.stop()}catch(e){}});scheduledOscs=[];
  const source=audioSource;audioSource=null;
  if(source){source.onended=null;try{source.stop()}catch(e){}}
  document.getElementById('btnPlay').classList.remove('active');
  draw();
}

document.getElementById('btnPlay').addEventListener('click',async()=>{
  if(isPlaying){stopPlayback();return}
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')await audioCtx.resume();
  const startTime=Math.max(0,scrollTime),durationMs=audioBuffer?audioBuffer.duration*1000:Math.max(dur()+3000,5000);
  if(startTime>=durationMs){scrollTime=durationMs;draw();return;}
  const token=++playbackToken,now=audioCtx.currentTime;
  isPlaying=true;playStartAudioTime=now;playStartTime=startTime;playbackEndTime=durationMs;
  document.getElementById('btnPlay').classList.add('active');
  const bm=60000/bpm;
  if(audioBuffer){
    audioSource=audioCtx.createBufferSource();audioSource.buffer=audioBuffer;
    const gainNode=audioCtx.createGain();gainNode.gain.value=0.7;audioSource.connect(gainNode);gainNode.connect(audioCtx.destination);
    audioSource.onended=()=>{if(token===playbackToken)stopPlayback(token)};
    audioSource.start(now,startTime/1000);
  }
  const firstBeat=Math.ceil(startTime/bm)*bm;
  for(let t=firstBeat;t<durationMs;t+=bm){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='triangle';o.frequency.value=Math.round(t/bm)%4===0?800:600;
    const relT=(t-startTime)/1000;g.gain.setValueAtTime(0.05,now+relT);g.gain.exponentialRampToValueAtTime(0.001,now+relT+0.03);o.start(now+relT);o.stop(now+relT+0.04);scheduledOscs.push(o);
  }
  notes.forEach(n=>{
    if(n.time_ms<startTime||n.time_ms>=durationMs)return;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='square';o.frequency.value=[330,392,523,659][n.lane];
    const relT=(n.time_ms-startTime)/1000;g.gain.setValueAtTime(0.06,now+relT);g.gain.exponentialRampToValueAtTime(0.001,now+relT+0.06);o.start(now+relT);o.stop(now+relT+0.06);scheduledOscs.push(o);
  });
  if(!audioBuffer)fallbackStopTimer=setTimeout(()=>stopPlayback(token),Math.max(0,durationMs-startTime)+500);
});
document.getElementById('btnStop').addEventListener('click',()=>stopPlayback());

/* ========== 缩放 ========== */
document.getElementById('btnZoomIn').addEventListener('click',()=>{zoom=Math.min(0.5,zoom*1.3);updateUI();draw()});
document.getElementById('btnZoomOut').addEventListener('click',()=>{zoom=Math.max(0.01,zoom/1.3);updateUI();draw()});

/* ========== 导出/导入 ========== */
document.getElementById('btnExport').addEventListener('click',()=>{
  if(!audioMeta||!audioMeta.sha256){showToast('当前浏览器无法生成音频校验标识，暂不能导出','err');return}
  const data={schema_version:2,song:{title:document.getElementById('songTitle').value||'Untitled',bpm:bpm,duration_ms:audioMeta.duration_ms},audio:{name:audioMeta.name,size:audioMeta.size,lastModified:audioMeta.lastModified,duration_ms:audioMeta.duration_ms,sha256:audioMeta.sha256},notes:notes.map(n=>({time_ms:n.time_ms,lane:n.lane,type:'tap'}))};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(data.song.title||'chart')+'.json';a.click();
});
document.getElementById('btnImport').addEventListener('click',()=>document.getElementById('jsonFile').click());
document.getElementById('jsonFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.song){document.getElementById('songTitle').value=d.song.title||'';bpm=d.song.bpm||120;document.getElementById('bpm').value=bpm}notes=(d.notes||[]).map(n=>({time_ms:n.time_ms,lane:n.lane})).filter(n=>n.lane>=0&&n.lane<4);notes.sort((a,b)=>a.time_ms-b.time_ms||a.lane-b.lane);scrollTime=0;draw()}catch(err){alert('JSON 解析失败: '+err.message)}};
  r.readAsText(f);
});
document.getElementById('btnClear').addEventListener('click',()=>{notes=[];draw();showToast('已清空所有音符','warn')});

/* ========== 从波形自动生成音符 ========== */
function showToast(msg,type='ok'){const t=document.getElementById('toast');t.textContent=msg;t.className=type;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
let lastAutoGenCount=0;

function autoGenerateNotesFromWaveform(){
  if(!audioBuffer||!waveformPeakCache){showToast('请先加载音频文件','err');return}
  const peaks=waveformPeakCache.peaks;
  const bucketSize=waveformPeakCache.bucketSize;
  const sampleRate=audioBuffer.sampleRate;
  const msPerBucket=bucketSize/sampleRate*1000;
  const sensitivity=parseFloat(document.getElementById('densitySelect').value);

  // 1. 计算峰值统计
  let sum=0,sumSq=0;
  for(let i=0;i<peaks.length;i++){sum+=peaks[i];sumSq+=peaks[i]*peaks[i]}
  const mean=sum/peaks.length;
  const stddev=Math.sqrt(Math.max(0,sumSq/peaks.length-mean*mean));
  const threshold=mean+stddev*sensitivity;

  // 2. 局部最大值检测
  const candidates=[];
  for(let i=1;i<peaks.length-1;i++){
    if(peaks[i]>=threshold&&peaks[i]>=peaks[i-1]&&peaks[i]>=peaks[i+1])candidates.push(i*msPerBucket);
  }

  // 3. 最小间距
  const minSpacing=Math.max(snapInt(),80);
  const filtered=[];
  let lastT=-Infinity;
  for(const t of candidates){if(t-lastT>=minSpacing){filtered.push(t);lastT=t}}

  if(filtered.length===0){showToast('未检测到明显峰值，请调高密度或检查音频','warn');return}

  // 4. 轮询分配到四通道，吸附到当前网格
  const newNotes=filtered.map((t,i)=>({time_ms:snap(t),lane:i%4}));
  const dedup=[];
  for(const n of newNotes){if(!dedup.some(d=>d.lane===n.lane&&Math.abs(d.time_ms-n.time_ms)<1))dedup.push(n)}

  // 直接生成（点击即替换）
  notes=dedup;
  notes.sort((a,b)=>a.time_ms-b.time_ms||a.lane-b.lane);
  lastAutoGenCount=dedup.length;
  draw();
  updateUI();
  showToast(`已生成 ${dedup.length} 个音符（${(dedup.length/audioBuffer.duration).toFixed(1)}个/秒）`,'ok');
}
document.getElementById('btnAutoGen').addEventListener('click',autoGenerateNotesFromWaveform);
document.getElementById('bpm').addEventListener('change',e=>{bpm=Math.max(40,Math.min(300,parseInt(e.target.value)||140));draw()});
document.getElementById('snapSelect').addEventListener('change',draw);

/* ========== 初始 ========== */
(function(){const bm=60000/bpm;for(let b=0;b<64;b++){if(Math.random()<0.55)notes.push({time_ms:Math.round(b*bm),lane:Math.floor(Math.random()*4)})}notes.sort((a,b)=>a.time_ms-b.time_ms||a.lane-b.lane)})();
updateUI();

/* ========== 持续渲染循环（播放时自动跟滚） ========== */
function renderLoop(){
  if(isPlaying&&audioCtx){
    const playbackTime=currentPlaybackTime();
    scrollTime=Math.max(0,playbackTime-pxToMs(SAW)*0.3);
    if(playbackTime>=playbackEndTime)stopPlayback(playbackToken);
  }
  draw();
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);

document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();document.getElementById('btnPlay').click()}});
